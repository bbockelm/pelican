---
name: Run Tests (macOS)

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_call:
    inputs:
      race_detection:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  run-tests:
    name: macOS (${{ matrix.binary_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary_name: pelican
            coverprofile: coverage.out
            tags: client
          - binary_name: pelican-server
            coverprofile: coverage-server.out
            tags: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # GoReleaser needs history to look up the previous tag, and so on

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "web_ui/frontend/package.json"
          cache: "npm"
          cache-dependency-path: "web_ui/frontend/package-lock.json"
          check-latest: true

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          # Reference: https://nextjs.org/docs/pages/guides/ci-build-caching#github-actions
          path: |
            ~/.npm
            ${{ github.workspace }}/web_ui/frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/package-lock.json') }}-${{ hashFiles('web_ui/frontend/**/*.js', 'web_ui/frontend/**/*.jsx', 'web_ui/frontend/**/*.ts', 'web_ui/frontend/**/*.tsx', '!web_ui/frontend/**/node_modules/**') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/package-lock.json') }}-

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true

      - name: Install gotestsum
        run: |
          if ! command -v gotestsum &> /dev/null; then
            go install gotest.tools/gotestsum@latest
            # Ensure that ~/go/bin is in PATH for subsequent steps.
            echo "$HOME/go/bin" >> $GITHUB_PATH
          fi

      - name: Install macOS dependencies
        run: ./github_scripts/osx_install.sh

      - name: Run "go test"
        env:
          JUNIT_FILE: junit-${{ matrix.binary_name }}.xml
        run: |
          # macOS defaults RLIMIT_NOFILE to 256, which is too tight for the
          # federation integration tests: a single fed legitimately opens ~132
          # descriptors and peak tests (e.g. eviction, concurrent range reads)
          # transiently reach ~214. Under -p=4 that tips past 256 and surfaces
          # as "XrdOpen: Unable to connect socket ...; invalid argument" (macOS
          # reports FD exhaustion on a socket call as EINVAL, not EMFILE).
          #
          # A bare `ulimit -n` cannot exceed the kernel's per-process cap
          # (kern.maxfilesperproc) or the launchd `maxfiles` limit, so raise
          # those first — otherwise the ulimit silently has no effect. Keep the
          # per-process ceiling modest (512, ~2.4x the ~214 peak) so a genuine
          # descriptor leak still climbs past it and fails CI rather than being
          # masked; give the system-wide table generous headroom for the many
          # concurrent xrootd child processes under -p=4.
          sudo sysctl -w kern.maxfiles=65536 kern.maxfilesperproc=512 || true
          sudo launchctl limit maxfiles 512 unlimited || true
          ulimit -n 512 || true
          echo "effective open-file limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn); kern.maxfilesperproc=$(sysctl -n kern.maxfilesperproc)"
          echo "::group::Building web UI"
          make web-build
          echo "::endgroup::"
          gotestsum \
            --format pkgname-and-test-fails \
            --hide-summary=output \
            --junitfile "$JUNIT_FILE" \
            -- \
            -p=4 \
            -timeout=${{ inputs.race_detection && '30m' || '15m' }} \
            ${{ inputs.race_detection && '-race' || '' }} \
            ${{ !inputs.race_detection && '-coverpkg=./...' || '' }} \
            ${{ !inputs.race_detection && '-covermode=count' || '' }} \
            ${{ !inputs.race_detection && format('-coverprofile={0}', matrix.coverprofile) || '' }} \
            -tags=${{ matrix.tags }} \
            ./...

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.binary_name }}-${{ runner.os }}
          path: junit-${{ matrix.binary_name }}.xml
          overwrite: true  # allow the workflow to be re-run, e.g., for flakey tests

      - name: Publish JUnit summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-${{ matrix.binary_name }}.xml

      - name: Generate GoReleaser config
        run: |
          make goreleaser-config

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --snapshot --config .goreleaser.generated.yml
